name: rinnebeat-sub2api

services:
  sub2api:
    image: weishaw/sub2api:0.1.170@sha256:b2dc2f3b0b0155d79ccf6d40e59f842d83817ea8af4f219c50084b4d29cfa23f
    container_name: sub2api-canary
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.25
    mem_limit: 1536m
    ports:
      - "127.0.0.1:${SERVER_PORT:-18080}:8080"
    volumes:
      - ./data/sub2api:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      RUN_MODE: standard
      TZ: Asia/Shanghai
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-sub2api}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: 12
      DATABASE_MAX_IDLE_CONNS: 4
      DATABASE_CONN_MAX_LIFETIME_MINUTES: 30
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: 5
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: 0
      REDIS_POOL_SIZE: 64
      REDIS_MIN_IDLE_CONNS: 2
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_OUTPUT_TO_STDOUT: "true"
      LOG_OUTPUT_TO_FILE: "false"
      LOG_SAMPLING_ENABLED: "true"
      LOG_SAMPLING_INITIAL: 20
      LOG_SAMPLING_THEREAFTER: 100
      SERVER_MAX_REQUEST_BODY_SIZE: 134217728
      GATEWAY_MAX_BODY_SIZE: 134217728
      SERVER_H2C_ENABLED: "false"
      GATEWAY_OPENAI_HTTP2_ENABLED: "true"
      GATEWAY_OPENAI_RESPONSE_HEADER_TIMEOUT: 120
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - caddy
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    cpus: 0.40
    mem_limit: 768m
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - work_mem=4MB
      - -c
      - max_wal_size=512MB
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-sub2api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api}
      TZ: Asia/Shanghai
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api} -d ${POSTGRES_DB:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: 0.15
    mem_limit: 320m
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --requirepass "$${REDIS_PASSWORD}"
        --save 300 10
        --appendonly no
        --maxmemory 256mb
        --maxmemory-policy noeviction
    volumes:
      - ./data/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

networks:
  internal:
    internal: true
  caddy:
    external: true
    name: services_default
